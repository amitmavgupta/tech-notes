# Host-based routing for all three surfaces, using nginx-ingress.
# Swap hostnames for your own domain, and update the DEFAULTS in
# configmap.yaml to match.
#
# Hubble UI and Grafana are each exposed on their own hostname because
# Hubble UI does not support being served from a sub-path (see README.md).
# TLS/cert-manager annotations are left out here — add whatever your
# cluster already uses for other ingresses.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retina-unified-ui
  namespace: kube-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: observability.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retina-unified-ui
                port:
                  number: 80
    - host: hubble.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-grafana
                port:
                  number: 80
  # tls:
  #   - hosts: [observability.example.com, hubble.example.com, grafana.example.com]
  #     secretName: retina-observability-tls

---
