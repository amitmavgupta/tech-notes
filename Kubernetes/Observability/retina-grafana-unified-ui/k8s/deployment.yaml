apiVersion: apps/v1
kind: Deployment
metadata:
  name: retina-unified-ui
  namespace: kube-system
  labels:
    app: retina-unified-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retina-unified-ui
  template:
    metadata:
      labels:
        app: retina-unified-ui
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: retina-unified-ui-nginx
        - name: html
          configMap:
            name: retina-unified-ui-html
